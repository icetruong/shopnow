spring.application.name=shipping-service

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

server.port=8087

order.service.url=http://localhost:8085
internal.secret-token=${INTERNAL_SECRET_TOKEN}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shipping-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===== Carrier abstraction =====
# mock = MockCarrierClient (mac dinh, khong goi mang)
# real = goi GHN/GHTK that (can GHN_TOKEN / GHN_SHOP_ID / GHTK_TOKEN)
carrier.mode=mock

# Cach B mo phong giao hang bang scheduler (mac dinh tat) - lam sau
carrier.mock.auto-advance=false

# ===== GHN - chi dung khi carrier.mode=real =====
carrier.ghn.token=${GHN_TOKEN:}
carrier.ghn.shop-id=${GHN_SHOP_ID:}
carrier.ghn.default-service-id=53321
carrier.ghn.base-url=https://dev-online-gateway.ghn.vn/shiip/public-api
carrier.ghn.label-print-url=https://dev-online-gateway.ghn.vn/a5/public-api/printA5
carrier.ghn.webhook-secret=${GHN_WEBHOOK_SECRET:}

# ===== GHTK - chi dung khi carrier.mode=real =====
carrier.ghtk.token=${GHTK_TOKEN:}
carrier.ghtk.base-url=https://services.giaohangtietkiem.vn
carrier.ghtk.webhook-secret=${GHTK_WEBHOOK_SECRET:}
carrier.ghtk.default-service=road
carrier.ghtk.label.dir=labels
carrier.ghtk.label.public-base-url=http://localhost:8087/labels

# ===== Resilience cho moi call sang carrier (retry / timeout / circuit breaker) =====
carrier.resilience.max-attempts=3
carrier.resilience.backoff-ms=2000
carrier.resilience.connect-timeout-ms=10000
carrier.resilience.read-timeout-ms=10000
carrier.resilience.cb-failure-threshold=5
carrier.resilience.cb-open-ms=30000

shipping.from.district-id=1442
shipping.from.ward-code=21012
# Diem gui dang text (GHTK dung ten)
shipping.from.name=Kho ShopNow Q1
shipping.from.phone=0900000000
shipping.from.address=123 Le Loi
shipping.from.province=TP. Ho Chi Minh
shipping.from.district=Quan 1

# Kich thuoc goi hang mac dinh (cm) khi client bo trong
shipping.default-package.length=20
shipping.default-package.width=15
shipping.default-package.height=10

shipping.default-carrier=GHN
shipping.default-item-weight-grams=500

# ===== Scheduled job: retry tao van don cho shipment PENDING =====
shipping.retry-job.enabled=true
shipping.retry-job.interval-ms=300000
shipping.retry-job.initial-delay-ms=60000
shipping.retry-job.max-attempts=5
shipping.retry-job.batch-size=50

# ===== Seed location_mappings tu GHN master-data =====
shipping.location-sync.enabled=false
shipping.location-sync.cron=0 0 3 * * SUN

# ===== Realtime refresh trong GET /shipments/{trackingCode}/track (chi khi mode=real) =====
shipping.track.realtime-refresh-minutes=30
