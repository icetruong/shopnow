spring.application.name=shipping-service

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

server.port=8087

order.service.url=http://localhost:8085
internal.secret-token=${INTERNAL_SECRET_TOKEN}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shipping-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===== Carrier abstraction =====
# mock = MockCarrierClient (mac dinh, khong goi mang)
# real = goi GHN/GHTK that
carrier.mode=mock

# Cach B mo phong giao hang bang scheduler (mac dinh tat) - lam sau
carrier.mock.auto-advance=false

# ===== GHN / GHTK - chi can khi carrier.mode=real (LAM SAU) =====
carrier.ghn.token=${GHN_TOKEN:}
carrier.ghn.shop-id=${GHN_SHOP_ID:}
carrier.ghn.default-service-id=53321
carrier.ghtk.token=${GHTK_TOKEN:}

shipping.from.district-id=1442
shipping.from.ward-code=21012

# Kich thuoc goi hang mac dinh (cm) khi client bo trong
shipping.default-package.length=20
shipping.default-package.width=15
shipping.default-package.height=10

shipping.default-carrier=GHN
shipping.default-item-weight-grams=500

shipping.retry-job.enabled=true                                                                                                                  
shipping.retry-job.interval-ms=300000                                                                                                  
shipping.retry-job.initial-delay-ms=60000                                                                  
shipping.retry-job.max-attempts=5                                                                                                                
shipping.retry-job.batch-size=50  
