spring.application.name=notification-service

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

server.port=8088

user.service.url = http://localhost:8081
order.service.url=http://localhost:8085
internal.secret-token=${INTERNAL_SECRET_TOKEN}

# Link trong email reset mật khẩu: {url}?token={resetToken}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:https://shopnow.com/reset-password}

# Người nhận cảnh báo stock.low_warning. Để trống -> chỉ log, không tạo notification.
notification.admin.user-id=${NOTIFICATION_ADMIN_USER_ID:}
notification.admin.email=${NOTIFICATION_ADMIN_EMAIL:}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer: chỉ dùng để đẩy record lỗi sang topic *.DLT (xem KafkaConsumerConfig)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
