spring.application.name=payment-service

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

server.port=8086

internal.secret-token=${INTERNAL_SECRET_TOKEN}

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.transaction-url=${VNPAY_TRANSACTION_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.locale=vn
vnpay.curr-code=VND

momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}
momo.query-endpoint=${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
momo.ipn-url=${MOMO_IPN_URL}
momo.redirect-url=${MOMO_REDIRECT_URL}
momo.request-type=captureWallet
momo.lang=vi

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}
stripe.currency=vnd

spring.kafka.bootstrap-servers=localhost:9092                                                                                                    
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer                                                      
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer 
